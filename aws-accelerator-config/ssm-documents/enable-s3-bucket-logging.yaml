description: |
  Enable S3 server access logging on a bucket pointing at the per-account
  per-region LZA-managed access-log bucket.

  S3 requires the target log bucket to be in the same account as the source
  bucket. We resolve the target name as
  `aws-accelerator-s3-access-logs-<account-id>-<region>` which LZA provisions
  in every enrolled account.

  Used by Config rule {{ AcceleratorPrefix }}-s3-bucket-logging-enabled.
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  BucketName:
    type: String
    description: Name of the bucket on which to enable server access logging.
  AutomationAssumeRole:
    type: String
    description: ARN of the IAM role SSM Automation assumes to perform the remediation.
mainSteps:
  - name: getContext
    action: "aws:executeAwsApi"
    description: Resolve the current account ID; region is taken from context.
    inputs:
      Service: sts
      Api: GetCallerIdentity
    outputs:
      - Name: AccountId
        Selector: "$.Account"
        Type: String
  - name: deriveTargetBucket
    action: "aws:executeScript"
    description: Compute the per-account per-region access-log bucket name.
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        AccountId: "{{ getContext.AccountId }}"
        Region: "{{ global:REGION }}"
      Script: |
        def handler(events, context):
            account = events['AccountId']
            region = events['Region']
            return {
                "TargetBucket": f"aws-accelerator-s3-access-logs-{account}-{region}"
            }
    outputs:
      - Name: TargetBucket
        Selector: "$.Payload.TargetBucket"
        Type: String
  - name: enableLogging
    action: "aws:executeAwsApi"
    inputs:
      Service: s3
      Api: PutBucketLogging
      Bucket: "{{ BucketName }}"
      BucketLoggingStatus:
        LoggingEnabled:
          TargetBucket: "{{ deriveTargetBucket.TargetBucket }}"
          TargetPrefix: "s3-access-logs/{{ BucketName }}/"
