#######################################################################################################################
# Shared VPC model WITHOUT Inspection VPC and Network Firewall                                                      #
# Cost-optimized: removes ~$570/month in Network Firewall costs                                                     #
# TGW spoke route goes directly to egress VPC instead of through inspection                                         #
#######################################################################################################################

defaultVpc:
  delete: true
  excludeAccounts: []

# AWS Transit Gateway Configurations
transitGateways:
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
    account: Network
    region: "{{ HomeRegion }}"
    shareTargets:
      organizationalUnits:
        - Infrastructure
      accounts:
        - PCI
    asn: {{ TransitGatewayASN }}
    dnsSupport: enable
    vpnEcmpSupport: enable
    defaultRouteTableAssociation: disable
    defaultRouteTablePropagation: disable
    autoAcceptSharingAttachments: enable
    routeTables:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-firewall"
        routes:
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-egress"
              account: Perimeter
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routes:
          # Routes directly to egress VPC instead of inspection
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-egress"
              account: Perimeter
          # Allow ingress VPC to reach shared-prod workloads (and return traffic)
          - destinationCidrBlock: "{{ HomeRegionProdWorkloadsCidr }}"
            attachment:
              vpcName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod"
              account: Network
          # Allow shared-prod return traffic to reach ingress VPC
          - destinationCidrBlock: "{{ HomeRegionIngressCidr }}"
            attachment:
              vpcName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress"
              account: Perimeter
          #############################################################################
          # CTI v7 reporting-DB Site-to-Site VPN static routes (on-prem client sites) #
          #                                                                           #
          # shared-prod (where iccmaindb lives) is associated to this spoke RT, so    #
          # on-prem CIDRs reachable over each VPN are added here as static routes     #
          # pointing at the VPN connection. The VPN connections themselves are        #
          # defined in the top-level `customerGateways` block below and associated    #
          # back to this same route table.                                            #
          #                                                                           #
          # ONLY non-10.0.0.0/8 CIDRs are routable — the LZA GlobalCidr is            #
          # 10.0.0.0/8 and the TGW owns that whole space, so any on-prem 10.234.x     #
          # LAN is unreachable over VPN. The sites source-NAT those LANs into         #
          # CGNAT (100.64.0.0/10) ranges, one per site, and we route the NAT range    #
          # instead of the 10.234.x prefix:                                           #
          #   RD      10.234.3.0/24 + 10.234.4.0/24        -> 100.64.0.0/22           #
          #   Kennedy 10.234.5.0/26                        -> 100.64.4.0/22           #
          #   Zima    all 11 of its 10.234.x subnets       -> 100.64.8.0/22           #
          #############################################################################
          # --- Liberty - Worldnet (peer 23.249.138.106) ---
          - destinationCidrBlock: 172.16.10.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-liberty"
          # --- Insight Kennedy - Worldnet (peer 64.89.2.105) ---
          - destinationCidrBlock: 172.27.150.0/27
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.27.100.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.27.50.0/25
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.27.75.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.27.200.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.27.220.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 172.26.4.0/22
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 192.168.100.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 192.168.20.128/29
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          - destinationCidrBlock: 192.168.70.0/26
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          # Kennedy source-NAT range: the site NATs its 10.234.5.0/26 LAN (which
          # collides with GlobalCidr 10.0.0.0/8) and presents it to AWS as this
          # CGNAT range. The 10.234.x prefix itself is never routed here.
          - destinationCidrBlock: 100.64.4.0/22
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
          # --- Insight RD - Altice (peer 190.166.239.186) ---
          - destinationCidrBlock: 172.20.0.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          - destinationCidrBlock: 172.20.1.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          - destinationCidrBlock: 172.20.2.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          - destinationCidrBlock: 172.20.3.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          - destinationCidrBlock: 172.20.4.0/24
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          # RD source-NAT range: the site NATs its 10.234.3.0/24 + 10.234.4.0/24
          # LANs (both colliding with GlobalCidr 10.0.0.0/8) and presents them to
          # AWS as this CGNAT range. The 10.234.x prefixes are never routed here.
          - destinationCidrBlock: 100.64.0.0/22
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
          # --- Insight Zima - Tigo (peer 181.207.82.178) ---
          # ALL of Zima's LANs are 10.234.x (10.234.12.0/27, .13.0/24, .14.0/25,
          # .15.0/27, .16.0/27, .17.0/27, .18.0/27, .19.0/26, .20.0/26, .25.0/26,
          # .30.0/27) and every one collides with GlobalCidr 10.0.0.0/8, so the
          # site source-NATs ALL of it to the CGNAT range below. That NAT range is
          # therefore Zima's ONLY route — no 10.234.x prefix is ever routed here.
          - destinationCidrBlock: 100.64.8.0/22
            attachment:
              vpnConnectionName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-zima"
      # PCI dedicated TGW route table - isolates PCI workloads from other spokes.
      # Only the PCI VPC attaches here, and the only route out is to the egress VPC.
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-pci"
        routes:
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-egress"
              account: Perimeter

#######################################################################################
# Site-to-Site VPN — CTI v7 reporting-DB access for on-prem client sites              #
#                                                                                     #
# Each on-prem site terminates an IPsec S2S VPN on its FortiGate (IKEv1/IKEv2) into   #
# the LZA-managed TGW in the Network account. Routing is STATIC on the AWS side       #
# (the sites run OSPF internally, which is irrelevant to AWS; no BGP ASN was          #
# provided). The on-prem CIDRs reachable over each tunnel are declared as static      #
# routes in the `tgw-rt-spoke` route table above (shared-prod, where iccmaindb runs,  #
# is associated to that RT).                                                          #
#                                                                                     #
# Cost: ~$0.05/hr per VPN connection + ~$0.05/hr TGW attachment ≈ ~$70-75/mo each.    #
#                                                                                     #
# Sites (4): Liberty DC, Insight Kennedy (Puerto Rico HQ), Insight RD (Republica     #
# Dominicana), Insight Zima (Colombia). Peer IPs confirmed by the provider; all four  #
# terminate on FortiGate running FortiOS 6.4.4+.                                      #
#                                                                                     #
# Notes:                                                                              #
#   * `asn` here is the CUSTOMER gateway device ASN — only used if the tunnel runs    #
#     BGP. With `staticRoutesOnly: true` it is not used for routing but the field is  #
#     still required; 65000 is a safe placeholder for a static-only tunnel.           #
#   * Tunnel inside-CIDRs + pre-shared keys are auto-generated by LZA/AWS. The        #
#     per-site FortiGate config (with those PSKs) is pulled after apply via           #
#     `aws ec2 get-vpn-connection-device-sample-configuration`.                        #
#######################################################################################
customerGateways:
  # --- Liberty - Worldnet --- (fully routable: 172.16.10.0/24)
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-cgw-liberty"
    account: Network
    region: "{{ HomeRegion }}"
    ipAddress: 23.249.138.106 # FortiGate VPN endpoint (confirmed by provider)
    asn: 65000 # static-only tunnel; not used for routing
    vpnConnections:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-liberty"
        transitGateway: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
        staticRoutesOnly: true
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"

  # --- Insight Kennedy - Worldnet --- (routable: all 172.x + 192.168.x; 10.234.5.0/26 blocked)
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-cgw-kennedy"
    account: Network
    region: "{{ HomeRegion }}"
    ipAddress: 64.89.2.105 # FortiGate VPN endpoint (confirmed by provider)
    asn: 65000
    vpnConnections:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-kennedy"
        transitGateway: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
        staticRoutesOnly: true
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"

  # --- Insight RD - Altice --- (routable: 5x 172.20.x/24; 10.234.3/4.0/24 blocked)
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-cgw-rd"
    account: Network
    region: "{{ HomeRegion }}"
    ipAddress: 190.166.239.186 # FortiGate VPN endpoint (confirmed; differs from the old DB source IP 186.150.204.2)
    asn: 65000
    vpnConnections:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-rd"
        transitGateway: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
        staticRoutesOnly: true
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"

  # --- Insight Zima - Tigo (Colombia) --- (all LANs are 10.234.x and collide with
  #   GlobalCidr 10.0.0.0/8; the site source-NATs everything to 100.64.8.0/22,
  #   which is its only route in tgw-rt-spoke above)
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-cgw-zima"
    account: Network
    region: "{{ HomeRegion }}"
    ipAddress: 181.207.82.178 # FortiGate VPN endpoint (confirmed by provider)
    asn: 65000
    vpnConnections:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-vpn-zima"
        transitGateway: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
        staticRoutesOnly: true
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"

centralNetworkServices:
  delegatedAdminAccount: Network
  gatewayLoadBalancers: []
  ipams:
    - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam"
      region: "{{ HomeRegion }}"
      description: IP regional allocation for LZA
      operatingRegions:
        - "{{ HomeRegion }}"
      scopes: []
      pools:
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-global-pool"
          description: IP global pool allocation for LZA
          provisionedCidrs:
            - "{{ GlobalCidr}}"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          description: IP regional pool allocation for LZA
          provisionedCidrs:
            - "{{ HomeRegionRegionalCidr}}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-global-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-ingress-pool"
          description: IP regional pool allocation for the Perimeter LZA account
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionIngressCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Perimeter
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-egress-pool"
          description: IP regional pool allocation for the Perimeter LZA account
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionEgressCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Perimeter
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
          description: IP regional pool allocation for the Network LZA account
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionEndpointsCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Network
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-sharedservices-pool"
          description: IP regional pool allocation for the SharedServices LZA account
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionSharedServicesCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - SharedServices
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-dev-pool"
          description: IP regional pool allocation for Dev LZA accounts
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionDevWorkloadsCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Network
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-test-pool"
          description: IP regional pool allocation for Test LZA accounts
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionTestWorkloadsCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Network
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          description: IP regional pool allocation for Prod LZA accounts
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionProdWorkloadsCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-regional-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - Network

        # PCI IPAM pool - sources from the GLOBAL pool (10.0.0.0/8) because
        # 10.16.0.0/14 sits outside the existing regional 10.0.0.0/12.
        # Shared directly to the PCI account (no shared-VPC pattern - PCI gets its
        # own VPC inside its own account for scope isolation).
        - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          description: IP pool allocation for the PCI LZA account
          locale: "{{ HomeRegion }}"
          provisionedCidrs:
            - "{{ HomeRegionPciWorkloadsCidr }}"
          sourceIpamPool: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-global-pool"
          tags:
            - key: Accelerator
              value: "{{ AcceleratorPrefix }}"
          shareTargets:
            accounts:
              - PCI

  # NO Network Firewall - removed to save ~$570/month

endpointPolicies:
  - name: Endpoint-Default
    document: vpc-endpoint-policies/default.json

vpcs:
  # VPC Endpoints
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints"
    account: Network
    region: "{{ HomeRegion }}"
    ipamAllocations:
      - ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
        netmaskLength: {{ HomeRegionIngressEndpointsVpcMaskLength }}
    defaultSecurityGroupRulesDeletion: true
    internetGateway: false
    enableDnsHostnames: true
    enableDnsSupport: true
    instanceTenancy: default
    routeTables:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-a"
        routes:
          - name: TgwRoute
            destination: 0.0.0.0/0
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-b"
        routes:
          - name: TgwRoute
            destination: 0.0.0.0/0
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-tgw-a"
        routes: []
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-tgw-b"
        routes: []
    subnets:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
          netmaskLength: {{ HomeRegionIngressEndpointsSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
          netmaskLength: {{ HomeRegionIngressEndpointsSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-tgw-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-tgw-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-Tgw"
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-tgw-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-rt-tgw-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-endpoints-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-Tgw"
    transitGatewayAttachments:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints"
        transitGateway:
          name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          account: Network
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-firewall"
        subnets:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-tgw-a"
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-tgw-b"
    gatewayEndpoints:
      defaultPolicy: Endpoint-Default
      endpoints:
        - service: s3
        - service: dynamodb
    interfaceEndpoints:
      defaultPolicy: Endpoint-Default
      central: true
      subnets:
        - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-a"
        - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-endpoints-b"
      endpoints:
        - service: ec2
        - service: ec2messages
        - service: ecr.api
        - service: ecr.dkr
        - service: kms
        - service: logs
        - service: monitoring
        - service: ssm
        # - service: ssm-contacts
        - service: ssm-incidents
        - service: ssmmessages

  # VPC Ingress
  #  - Deploys to perimeter account
  #  - Utilizes two AZs for deployment of subnets, leaving space for 3rd AZ
  #     - Firewall Subnet - provisioned if you require a firewall
  #     - Public Subnet
  #     - Transit Gateway attachment subnet
  #  - This VPC is intended for load balancers or similar services
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress"
    account: Perimeter
    region: "{{ HomeRegion }}"
    ipamAllocations:
      - ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-ingress-pool"
        netmaskLength: {{ HomeRegionIngressVpcMaskLength }}
    defaultSecurityGroupRulesDeletion: true
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    instanceTenancy: default
    routeTables:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-fw-a"
        routes: []
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-fw-b"
        routes: []
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-public-a"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: internetGateway
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-public-b"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: internetGateway
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-tgw-a"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-tgw-b"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
    subnets:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-fw-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-fw-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-ingress-pool"
          netmaskLength: {{ HomeRegionIngressFwSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-fw-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-rt-fw-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-ingress-pool"
          netmaskLength: {{ HomeRegionIngressFwSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ingress-public-a"
        availabilityZone: a
