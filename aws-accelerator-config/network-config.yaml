      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-app-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-app-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 24
        shareTargets:
          accounts:
            - Production
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-app-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-app-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 24
        shareTargets:
          accounts:
            - Production
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-data-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-data-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 26
        shareTargets:
          accounts:
            - Production
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-data-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-data-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 26
        shareTargets:
          accounts:
            - Production
      # Public subnet for the CTI v7 direct-EIP SIP endpoint ONLY (Option B).
      # Uses the shared-prod-rt-public-a route table (IGW default route). Shared
      # to Production like the app/data subnets. /27 = 32 IPs is plenty for a
      # single SIP box plus room; keeps the public footprint minimal.
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-public-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-public-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 27
        shareTargets:
          accounts:
            - Production
      ## DO NOT MODIFY SUBNETS FROM THIS POINT ON
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-tgw-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-tgw-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-tgw"
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-tgw-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-tgw-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-workloads-prod-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-tgw"
    transitGatewayAttachments:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod"
        transitGateway:
          name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          account: Network
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-spoke"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-firewall"
        subnets:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-tgw-a"
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-tgw-b"
    gatewayEndpoints:
      defaultPolicy: Endpoint-Default
      endpoints:
        - service: s3
        - service: dynamodb
    useCentralEndpoints: true

  # PCI VPC
  #  - Deploys directly into the PCI account (NOT shared from Network) to keep PCI scope
  #    contained inside one auditable account boundary.
  #  - Three subnet tiers per AZ: public (for the PCI ALB), app (for cardholder data
  #    workloads), data (for databases - no internet route at all).
  #  - Attaches to the dedicated tgw-rt-pci route table so PCI cannot reach Dev/Test/Prod
  #    spokes and they cannot reach PCI. Only egress via the Perimeter egress VPC is allowed.
  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci"
    account: PCI
    region: "{{ HomeRegion }}"
    ipamAllocations:
      - ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
        netmaskLength: {{ HomeRegionPciVpcMaskLength }}
    defaultSecurityGroupRulesDeletion: true
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    instanceTenancy: default
    routeTables:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-public-a"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: internetGateway
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-public-b"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: internetGateway
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-app-a"
        routes:
          - name: TgwRoute
            destination: 0.0.0.0/0
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-app-b"
        routes:
          - name: TgwRoute
            destination: 0.0.0.0/0
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      # Data subnets have NO internet route. Data leaves only via VPC endpoints
      # or via TGW to other in-scope accounts (none, currently).
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-data-a"
        routes:
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-data-b"
        routes:
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-tgw-a"
        routes: []
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-tgw-b"
        routes: []
    subnets:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-public-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-public-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciPublicSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-public-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-public-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciPublicSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-app-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-app-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciAppSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-app-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-app-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciAppSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-data-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-data-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciDataSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-data-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-data-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: {{ HomeRegionPciDataSubnetMaskLength }}
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-tgw-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-tgw-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-Tgw"
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-tgw-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-rt-tgw-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-ipam-pci-pool"
          netmaskLength: 28
        tags:
          - key: SubnetType
            value: "{{ AcceleratorPrefix }}-Tgw"
    transitGatewayAttachments:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci"
        transitGateway:
          name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          account: Network
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-pci"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt-firewall"
        subnets:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-tgw-a"
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-pci-tgw-b"
    gatewayEndpoints:
      defaultPolicy: Endpoint-Default
      endpoints:
        - service: s3
        - service: dynamodb
    useCentralEndpoints: true

# VPC Flow Logs
#   - Logs sent to CloudWatch Logs which are then forwarded to the log account's central logging bucket
#   - Dynamic filter created to use prefix for flow logs
vpcFlowLogs:
  trafficType: ALL
  maxAggregationInterval: 600
  destinations:
    - cloud-watch-logs
  destinationsConfig:
    cloudWatchLogs:
      retentionInDays: 30
  defaultFormat: false
  customFields:
    - version
    - account-id
    - interface-id
    - srcaddr
    - dstaddr
    - srcport
    - dstport
    - protocol
    - packets
    - bytes
    - start
    - end
    - action
    - log-status
    - vpc-id
    - subnet-id
    - instance-id
    - tcp-flags
    - type
    - pkt-srcaddr
    - pkt-dstaddr
    - region
    - az-id
    - pkt-src-aws-service
    - pkt-dst-aws-service
    - flow-direction
    - traffic-path
