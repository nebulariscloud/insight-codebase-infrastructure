        netmaskLength: {{ HomeRegionSharedProdVpcMaskLength }}
    defaultSecurityGroupRulesDeletion: true
    # IGW enabled ONLY to support the CTI v7 direct-EIP SIP endpoint (Option B).
    # CTI v7 is a SIP server with direct RTP media and an Aheeva license keyed to
    # its public IP, so it cannot live behind NAT like the other workloads. It
    # lands in the dedicated shared-prod-public-a subnet below; all other
    # shared-prod subnets remain private (0.0.0.0/0 -> TGW). See
    # docs/07-Operations/cti-v7-lza-exception.md.
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    instanceTenancy: default
    routeTables:
      ## Add route tables for subnets shared with accounts
      # Public route table for the CTI v7 SIP endpoint only. Internal RFC1918
      # traffic (to WS Aheeva et al.) still goes via TGW; only non-internal
      # destinations use the IGW. Mirrors the pci-rt-public-* pattern.
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-public-a"
        routes:
          - name: TgwRoute
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: internetGateway
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-shared-prod-rt-app-a"
