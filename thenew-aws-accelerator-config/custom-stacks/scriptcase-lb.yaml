AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Application Load Balancer dedicated to Scriptcase, deployed in the Ingress VPC
  public subnets. Mirrors the production-hardened ingress-alb pattern (WAF,
  access logs, deletion protection, optional HTTPS) but uses a separate name,
  security group, target group, WAF, and exports so it can coexist with the
  primary ingress ALB.

Parameters:
  VpcId:
    Type: String
    Description: The Ingress VPC ID
  PublicSubnetA:
    Type: String
    Description: Ingress public subnet A ID
  PublicSubnetB:
    Type: String
    Description: Ingress public subnet B ID
  TargetPort:
    Type: Number
    Default: 8091
    Description: Scriptcase backend port (typically 8091, sometimes 80)
  TargetProtocol:
    Type: String
    Default: HTTP
    AllowedValues: [HTTP, HTTPS]
    Description: Protocol to use when talking to Scriptcase
  HealthCheckPath:
    Type: String
    Default: /
    Description: Health check path for the target group
  HealthCheckMatcher:
    Type: String
    Default: '200,302'
    Description: HTTP status codes considered healthy for Scriptcase
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for HTTPS listener (leave empty for HTTP only)
  AccessLogsBucketName:
    Type: String
    Default: ''
    Description: >
      S3 bucket for ALB access logs. Leave empty to disable access logs.
      LZA pattern: aws-accelerator-elb-access-logs-<account-id>-<region>
  EnableWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable AWS WAF with AWS managed rules
  CrossZoneLoadBalancing:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Cross-zone load balancing. Disable to reduce cross-AZ data transfer costs
      when targets are in a different VPC via TGW.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasAccessLogs: !Not [!Equals [!Ref AccessLogsBucketName, '']]
  EnableWafCondition: !Equals [!Ref EnableWaf, 'true']

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Scriptcase ALB - allows internet traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS from internet
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref TargetPort
          ToPort: !Ref TargetPort
          CidrIp: 10.12.0.0/14
          Description: Allow traffic to shared-prod workloads (Scriptcase)
      Tags:
        - Key: Name
          Value: AWSAccelerator-scriptcase-lb-sg
        - Key: Accelerator
          Value: AWSAccelerator

  ScriptcaseALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: scriptcase-lb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'true'
        - Key: routing.http.desync_mitigation_mode
          Value: defensive
        - !If
          - HasAccessLogs
          - Key: access_logs.s3.enabled
            Value: 'true'
          - !Ref AWS::NoValue
        - !If
          - HasAccessLogs
          - Key: access_logs.s3.bucket
            Value: !Ref AccessLogsBucketName
          - !Ref AWS::NoValue
        - !If
          - HasAccessLogs
          - Key: access_logs.s3.prefix
            Value: scriptcase-lb
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: AWSAccelerator-scriptcase-lb
        - Key: Accelerator
          Value: AWSAccelerator

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: !Ref TargetProtocol
      Port: !Ref TargetPort
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: !Ref TargetProtocol
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: !Ref HealthCheckMatcher
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: load_balancing.cross_zone.enabled
          Value: !Ref CrossZoneLoadBalancing
      Tags:
        - Key: Name
          Value: AWSAccelerator-scriptcase-lb-tg
        - Key: Accelerator
          Value: AWSAccelerator

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ScriptcaseALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ScriptcaseALB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: EnableWafCondition
    Properties:
      Name: scriptcase-lb-waf
      Scope: REGIONAL
      Description: WAF for the Scriptcase ALB with AWS managed rules
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: scriptcase-lb-waf
      Rules:
        # AWS managed rule set - common vulnerabilities (OWASP Top 10 coverage).
        # Run with default actions (no overrides). If a legitimate Scriptcase
        # request gets blocked in production, add a targeted Count override here.
        - Name: AWS-CommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-CommonRuleSet
        - Name: AWS-KnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-KnownBadInputs
        - Name: AWS-IPReputation
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-IPReputation
        - Name: RateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimit
      Tags:
        - Key: Name
          Value: AWSAccelerator-scriptcase-lb-waf
        - Key: Accelerator
          Value: AWSAccelerator

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: EnableWafCondition
    Properties:
      ResourceArn: !Ref ScriptcaseALB
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  AlbDnsName:
    Description: DNS name of the Scriptcase Application Load Balancer
    Value: !GetAtt ScriptcaseALB.DNSName
    Export:
      Name: scriptcase-lb-dns
  AlbArn:
    Description: ARN of the Scriptcase Application Load Balancer
    Value: !Ref ScriptcaseALB
  TargetGroupArn:
    Description: ARN of the Scriptcase target group - register Scriptcase IP here
    Value: !Ref TargetGroup
    Export:
      Name: scriptcase-lb-tg-arn
  SecurityGroupId:
    Description: Security group ID of the Scriptcase ALB
    Value: !Ref AlbSecurityGroup
  WafWebAclArn:
    Description: ARN of the WAF Web ACL
    Condition: EnableWafCondition
    Value: !GetAtt WebAcl.Arn
