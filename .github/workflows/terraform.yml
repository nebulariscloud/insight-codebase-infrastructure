###############################################################################
# Terraform CI for the terraform/live/ tree.
#
# - On PR: detects which leaves changed and runs terraform fmt + validate +
#   plan for each. Posts a sticky PR comment per leaf with the plan output.
# - On push to main: runs apply for changed leaves, gated by the GitHub
#   "production" environment (configure required reviewers there).
#
# All AWS access happens via OIDC into the GitHubActions-Terraform role in
# SharedServices, which then chains into TerraformExecution in each spoke.
# No long-lived AWS keys.
###############################################################################

name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/live/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/live/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      leaf:
        description: "Specific leaf path (e.g. terraform/live/perimeter/scriptcase-lb). Empty = all live leaves."
        required: false

permissions:
  id-token: write     # required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-2"
  # Set this in repo or org secrets after running terraform/_bootstrap/.
  AWS_ROLE_ARN: ${{ secrets.AWS_TF_ROLE_ARN }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  ###########################################################################
  # 1. Detect which live/ leaves are affected by this change
  ###########################################################################
  detect:
    runs-on: ubuntu-latest
    outputs:
      leaves: ${{ steps.list.outputs.leaves }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine affected leaves
        id: list
        shell: bash
        run: |
          set -euo pipefail

          # If the user pinned a leaf via workflow_dispatch, use that.
          if [[ -n "${{ github.event.inputs.leaf }}" ]]; then
            leaves='["${{ github.event.inputs.leaf }}"]'
            echo "leaves=$leaves" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Files changed
          changed=$(git diff --name-only "$base" "$head" || true)

          # If a module changed, plan every live leaf.
          if echo "$changed" | grep -q '^terraform/modules/'; then
            mapfile -t leaves < <(find terraform/live -mindepth 2 -maxdepth 2 -type d ! -name '_template' | sort)
          else
            mapfile -t leaves < <(echo "$changed" \
              | grep '^terraform/live/' \
              | grep -v '^terraform/live/_template/' \
              | awk -F/ '{ print $1"/"$2"/"$3"/"$4 }' \
              | sort -u)
          fi

          if [[ ${#leaves[@]} -eq 0 ]]; then
            echo "leaves=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${leaves[@]}" | jq -R . | jq -s -c .)
            echo "leaves=$json" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  ###########################################################################
  # 2. Plan every affected leaf in parallel
  ###########################################################################
  plan:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leaf: ${{ fromJSON(needs.detect.outputs.leaves) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-tf-plan-${{ github.run_id }}

      - name: Sanitize leaf id for artifact naming
        id: ids
        run: |
          leaf_id="$(echo '${{ matrix.leaf }}' | tr '/' '-')"
          echo "leaf_id=$leaf_id" >> "$GITHUB_OUTPUT"

      - name: terraform fmt
        working-directory: ${{ matrix.leaf }}
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        working-directory: ${{ matrix.leaf }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: ${{ matrix.leaf }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ matrix.leaf }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out tfplan \
            -var-file=terraform.tfvars 2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan-show.txt

      #######################################################################
      # Surface deletions in the PR comment instead of burying them in a
      # collapsed <details> block. A reviewer skimming the sticky comment
      # should not have to expand and read a 600-line plan to notice that
      # something is about to be destroyed.
      #######################################################################
      - name: Summarise destroys
        id: destroys
        working-directory: ${{ matrix.leaf }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json

          # No mapfile — see the note in the apply job's destroy guard.
          jq -r '
            .resource_changes[]?
            | select(.change.actions // [] | index("delete"))
            | "\(.address) [\(.change.actions | join(","))]"
          ' plan.json > doomed.txt

          count=$(grep -c . doomed.txt || true)
          count=${count:-0}

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<DOOMED_EOF"
            if [ "$count" -eq 0 ]; then
              echo "none"
            else
              cat doomed.txt
            fi
            echo "DOOMED_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "::warning title=${{ matrix.leaf }} plans ${count} deletion(s)::This apply will be blocked on merge unless the PR description carries 'ALLOW-DESTROY: ${{ matrix.leaf }}'."
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ steps.ids.outputs.leaf_id }}
          path: |
            ${{ matrix.leaf }}/tfplan
            ${{ matrix.leaf }}/plan-show.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.leaf }}/plan-show.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... (truncated, see workflow log)'
              : plan;
            const destroyCount = parseInt('${{ steps.destroys.outputs.count }}' || '0', 10);
            const destroyList = `${{ toJSON(steps.destroys.outputs.list) }}`;

            // Deletions go ABOVE the collapsed plan, not inside it.
            const header = destroyCount > 0
              ? [
                  `### \`${{ matrix.leaf }}\` plan — ⚠️ ${destroyCount} DELETION(S) PLANNED`,
                  '',
                  '```',
                  JSON.parse(destroyList).trim(),
                  '```',
                  '',
                  '> The destroy guard will **block the apply on merge** unless the PR',
                  '> description contains:',
                  '>',
                  '> ```',
                  `> ALLOW-DESTROY: ${{ matrix.leaf }}`,
                  '> ```',
                  '>',
                  '> If you did not intend to delete anything, this leaf most likely has',
                  '> pre-existing drift. Fix that on its own PR rather than authorising',
                  '> the destroy here.',
                  '',
                ]
              : [`### \`${{ matrix.leaf }}\` plan — no deletions`, ''];

            const body = [
              '<!-- tf-plan:${{ matrix.leaf }} -->',
              ...header,
              '<details><summary>show full plan</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '<!-- tf-plan:${{ matrix.leaf }} -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  ###########################################################################
  # 3. Apply on push to main, gated by the "production" environment
  ###########################################################################
  apply:
    needs: [detect, plan]
    if: github.event_name == 'push' && needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: production    # set required reviewers on this env in repo settings
    strategy:
      fail-fast: false
      max-parallel: 1          # serialize applies; safer for state and review
      matrix:
        leaf: ${{ fromJSON(needs.detect.outputs.leaves) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-tf-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ matrix.leaf }}
        run: terraform init -input=false

      #######################################################################
      # Plan first, inspect it, THEN apply that exact plan file.
      #
      # The previous version ran `terraform apply -auto-approve`, which
      # re-plans internally and applies whatever it finds — nobody ever saw
      # the diff before it executed. On 2026-08-08 that destroyed a
      # production EC2 instance (cti-v7) that had unrelated pre-existing
      # drift, during a run triggered by an unrelated WAF module change.
      # Applying a saved plan file guarantees what we inspected is what runs.
      #######################################################################
      - name: terraform plan
        working-directory: ${{ matrix.leaf }}
        run: terraform plan -input=false -no-color -out tfplan -var-file=terraform.tfvars

      #######################################################################
      # Destroy guard.
      #
      # WHY THIS EXISTS: a change under terraform/modules/** fans out to every
      # leaf (see the detect job). On push to main that means ~23 applies, so
      # ANY leaf carrying pre-existing drift gets that drift executed — even
      # though the PR author never touched it. That is how cti-v7 was lost.
      #
      # This step fails the apply if the plan would delete anything, unless
      # the commit message explicitly authorises it.
      #
      # TO AUTHORISE A DESTROY, use any ONE of these three:
      #
      #   a) A line in the PR description:
      #        ALLOW-DESTROY: terraform/live/production/cti-v7
      #        ALLOW-DESTROY: all
      #
      #   b) The same line in the branch's commit message.
      #
      #   c) An `allow-destroy` label on the PR (blanket for that PR only).
      #
      # Prefer (a) with a named leaf. "all" and the label are blunt instruments.
      #
      # WHY ALL THREE: the first version of this guard read only
      # github.event.head_commit.message, on the assumption that a squash merge
      # carries the PR description. In this repo it does not — it carries the
      # BRANCH commit message. PR #57 was merged on 2026-08-08 with a valid
      # authorisation sitting in its description, and the guard blocked it
      # anyway because it could not see it. Reading the PR body via the API
      # fixes that, and the label gives a one-click escape hatch when a
      # description edit is inconvenient.
      #
      # Note "replace" shows up as ["delete","create"] (or ["create","delete"]
      # for create_before_destroy), so in-place replacements are caught too —
      # deliberately, since a replacement of a stateful resource is exactly
      # the case that hurts.
      #######################################################################
      - name: Destroy guard
        working-directory: ${{ matrix.leaf }}
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          LEAF: ${{ matrix.leaf }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          terraform show -json tfplan > plan.json

          # NOTE: deliberately no `mapfile`/`readarray` here. Those are bash 4+
          # builtins; macOS ships bash 3.2, so using them would make this step
          # impossible to test outside CI. Writing jq output to a file and
          # counting lines works identically everywhere.
          jq -r '
            .resource_changes[]?
            | select(.change.actions // [] | index("delete"))
            | "\(.address)  ->  [\(.change.actions | join(","))]"
          ' plan.json > doomed.txt

          count=$(grep -c . doomed.txt || true)
          count=${count:-0}

          if [ "$count" -eq 0 ]; then
            echo "Destroy guard: no deletions planned for ${LEAF}. Proceeding."
            exit 0
          fi

          echo "Destroy guard: ${count} resource(s) would be DELETED or REPLACED in ${LEAF}:"
          sed 's/^/  /' doomed.txt

          # Gather every place an authorisation might live. Squash merges here
          # carry the branch commit message, so the PR description has to be
          # fetched separately via the API.
          PR_BODY=""
          PR_LABELS=""
          if PR_JSON=$(gh api "repos/${REPO}/commits/${SHA}/pulls" 2>/dev/null); then
            PR_BODY=$(printf '%s' "${PR_JSON}" | jq -r '.[0].body // ""')
            PR_LABELS=$(printf '%s' "${PR_JSON}" | jq -r '[.[]?.labels[]?.name] | join(" ")')
            PR_NUM=$(printf '%s' "${PR_JSON}" | jq -r '.[0].number // "none"')
            echo "Destroy guard: resolved PR #${PR_NUM}; labels: ${PR_LABELS:-<none>}"
          else
            echo "Destroy guard: could not resolve a PR for ${SHA} (direct push?). Falling back to the commit message only."
          fi

          # Blanket per-PR escape hatch via label.
          case " ${PR_LABELS} " in
            *" allow-destroy "*)
              echo "Destroy guard: 'allow-destroy' label present on the PR. Proceeding."
              exit 0
              ;;
          esac

          # Exact whole-line match on the authorisation, NOT a substring match.
          #
          # A naive `grep -F "ALLOW-DESTROY: $LEAF"` is a substring test, so
          # "ALLOW-DESTROY: terraform/live/production/webapps-php73" would also
          # authorise destroys in ".../webapps" — a real collision in this repo,
          # which has both. awk gives an exact compare after stripping
          # surrounding whitespace and any trailing CR (PR bodies and
          # squash-merge commit bodies frequently carry \r).
          if printf '%s\n%s\n' "${COMMIT_MSG}" "${PR_BODY}" | awk -v leaf="${LEAF}" '
              /^[[:space:]]*ALLOW-DESTROY:/ {
                v = $0
                sub(/^[[:space:]]*ALLOW-DESTROY:[[:space:]]*/, "", v)
                sub(/[[:space:]]*\r?$/, "", v)
                if (v == "all" || v == leaf) { found = 1 }
              }
              END { exit(found ? 0 : 1) }
            '; then
            echo "Destroy guard: authorisation found in commit message or PR description. Proceeding."
            exit 0
          fi

          {
            echo "### Destroy guard BLOCKED \`${LEAF}\`"
            echo
            echo "The plan for this leaf would delete or replace:"
            echo
            sed 's/^/- `/; s/$/`/' doomed.txt
            echo
            echo "No authorisation was found in the commit message, the PR"
            echo "description, or the PR labels."
            echo
            echo "This usually means the leaf has **pre-existing drift** unrelated to"
            echo "the change being merged — a stale id in tfvars, or an edit that was"
            echo "made and never applied. Investigate the drift on its own PR."
            echo
            echo "If the destruction is genuinely intended, authorise it with ONE of:"
            echo
            echo "1. A line in the PR description (then re-run this job — the"
            echo "   description is read live, so no re-merge is needed):"
            echo
            echo '   ```'
            echo "   ALLOW-DESTROY: ${LEAF}"
            echo '   ```'
            echo
            echo "2. An \`allow-destroy\` label on the PR (blanket for that PR)."
            echo
            echo "3. The same \`ALLOW-DESTROY:\` line in the branch commit message."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error title=Destroy guard blocked ${LEAF}::Plan would delete/replace ${count} resource(s) with no ALLOW-DESTROY authorisation. See the job summary."
          exit 1

      - name: terraform apply
        working-directory: ${{ matrix.leaf }}
        run: terraform apply -input=false -auto-approve tfplan
